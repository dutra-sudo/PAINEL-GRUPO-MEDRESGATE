<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Ações — Grupo Medresgate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul-escuro: #0d2137;
    --azul-medio: #1a3a5c;
    --azul-acento: #1e6fa8;
    --azul-claro: #e8f2fa;
    --cinza-fundo: #f4f7fa;
    --texto: #1c2b3a;
    --texto-suave: #55697a;
    --borda: #dbe6ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cinza-fundo);
    font-family: 'Inter', sans-serif;
    color: var(--texto);
  }
  header {
    background: linear-gradient(135deg, var(--azul-escuro), var(--azul-medio));
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
  }
  header .eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 12px;
    color: #9fc4e0;
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    margin: 0 0 12px;
  }
  header .meta {
    font-size: 13px;
    color: #cfe0ee;
  }
  main {
    max-width: 900px;
    margin: -24px auto 0;
    padding: 0 20px 60px;
  }
  .section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--azul-medio);
    font-weight: 700;
    margin: 40px 0 4px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--azul-acento);
  }
  .card {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 10px;
    margin: 14px 0;
    box-shadow: 0 1px 3px rgba(13,33,55,0.06);
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 20px;
    cursor: pointer;
    gap: 12px;
  }
  .card-header:hover { background: var(--azul-claro); }
  .card-header-left { flex: 1; min-width: 0; }
  .card-number {
    display: inline-block;
    font-weight: 700;
    color: var(--azul-acento);
    margin-right: 8px;
  }
  .card-processo {
    font-size: 12px;
    color: var(--texto-suave);
    margin-bottom: 4px;
  }
  .card-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--azul-escuro);
    line-height: 1.4;
  }
  .card-partes {
    font-size: 13px;
    color: var(--texto-suave);
    margin-top: 4px;
  }
  .card-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    background: #fdf3e3;
    color: #b06a00;
  }
  .chevron {
    transition: transform 0.2s ease;
    color: var(--azul-acento);
  }
  .card.open .chevron { transform: rotate(180deg); }
  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .card.open .card-body { max-height: 3000px; }
  .card-body-inner {
    padding: 0 20px 20px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--texto);
    white-space: pre-wrap;
  }
  .updated {
    text-align: center;
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 10px;
  }
  footer {
    text-align: center;
    padding: 30px 20px;
    font-size: 12px;
    color: var(--texto-suave);
    border-top: 1px solid var(--borda);
    margin-top: 30px;
  }
  footer .firm {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--azul-escuro);
    margin-bottom: 6px;
  }
  .loading, .error {
    text-align: center;
    padding: 40px;
    color: var(--texto-suave);
  }
  @media (max-width: 600px) {
    header h1 { font-size: 24px; }
    .card-header { flex-direction: column; }
    .card-header-right { align-self: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Bartolomeo Bhering Braga Dutra Advogados</div>
  <h1>Relatório de Ações / Grupo Medresgate</h1>
  <div class="meta" id="metaLine">Carregando dados... · Matheus Dutra · OAB/MG 122.243</div>
</header>

<main>
  <div class="section-label">Processos em andamento</div>
  <div id="lista" class="loading">Carregando processos...</div>
</main>

<footer>
  <div class="firm">Bartolomeo Bhering Braga Dutra Advogados Associados</div>
  Matheus Dutra · OAB/MG 122.243 | Felipe Bartolomeo · OAB/MG 95.264
</footer>

<script>
  var CONFIG = {
    clientName: 'Grupo Medresgate',
    scriptUrl: 'https://script.google.com/macros/s/AKfycbxQTyU4sl5w0vG3Mr2DdXQv-E5G7fW0zaS1Js9epUeuUdovN5MCYB5IbwYB7L1LrC2eQg/exec'
  };

  var CNJ_REGEX = /\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/;
  // Sequência de texto em CAIXA ALTA (nomes de partes), com "VS" ou " X " separando autor/réu
  var PARTES_REGEX = /([A-ZÀ-Ú0-9][A-ZÀ-Ú0-9.\-\/()º° ]{3,}?\s(?:VS\.?|X)\s[A-ZÀ-Ú0-9][A-ZÀ-Ú0-9.\-\/()º° ]{3,})/;

  function renderError(msg) {
    document.getElementById('lista').innerHTML = '<div class="error">' + msg + '</div>';
  }

  function toggleCard(el) {
    el.parentElement.classList.toggle('open');
  }

  function extractCard(rawText, idx) {
    var text = rawText.replace(/\s+/g, ' ').trim();

    var cnjMatch = text.match(CNJ_REGEX);
    var numero = cnjMatch ? cnjMatch[0] : null;

    var partesMatch = text.match(PARTES_REGEX);
    var partes = partesMatch ? partesMatch[1].replace(/\s+/g, ' ').trim() : null;

    // corpo = texto original menos o trecho de partes já identificado (para não repetir no card)
    var corpo = rawText.trim();
    if (partesMatch) {
      corpo = corpo.replace(partesMatch[1], '').trim();
    }

    return {
      numero: numero,
      partes: partes,
      corpo: corpo,
      titulo: partes || ('Processo ' + (idx + 1))
    };
  }

  function renderData(data) {
    var lista = document.getElementById('lista');
    lista.classList.remove('loading');
    lista.innerHTML = '';

    if (!data.processos || data.processos.length === 0) {
      lista.innerHTML = '<div class="error">Nenhum processo encontrado no relatório.</div>';
      return;
    }

    data.processos.forEach(function (texto, idx) {
      var info = extractCard(texto, idx);

      var card = document.createElement('div');
      card.className = 'card';

      var processoLine = info.numero ? ('Processo n° ' + info.numero) : 'Processo não identificado no relatório';

      card.innerHTML =
        '<div class="card-header" onclick="toggleCard(this)">' +
          '<div class="card-header-left">' +
            '<div class="card-processo">' + processoLine + '</div>' +
            '<div class="card-title"><span class="card-number">' + (idx + 1) + '.</span></div>' +
            (info.partes ? '<div class="card-partes">' + info.partes + '</div>' : '') +
          '</div>' +
          '<div class="card-header-right">' +
            '<span class="badge">Em andamento</span>' +
            '<span class="chevron">▾</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-body"><div class="card-body-inner">' + info.corpo + '</div></div>';

      lista.appendChild(card);
    });

    var d = new Date(data.updatedAt);
    document.getElementById('metaLine').textContent =
      'Atualizado em ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR') +
      ' · Matheus Dutra · OAB/MG 122.243';
  }

  window.handleData = function (data) {
    try {
      renderData(data);
    } catch (err) {
      renderError('Erro ao processar os dados recebidos.');
    }
  };

  (function loadData() {
    var script = document.createElement('script');
    script.src = CONFIG.scriptUrl + '?callback=handleData&t=' + Date.now();
    script.onerror = function () {
      renderError('Não foi possível carregar os dados. Verifique se o Apps Script foi implantado como "Qualquer pessoa" e se a URL em CONFIG.scriptUrl está correta.');
    };
    document.body.appendChild(script);
  })();
</script>

</body>
</html>
